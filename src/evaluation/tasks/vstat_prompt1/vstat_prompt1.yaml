dataset_path: json
class: !function lmms_eval.tasks.vstat.utils.VSTATTask
dataset_kwargs:
  data_files:
    test: data/vstat/vstat_qa_clean.json
task: vstat_prompt1
test_split: test
output_type: generate_until
doc_to_visual: !function lmms_eval.tasks.vstat.utils.doc_to_visual
doc_to_text: !function utils.doc_to_text_prompt1
doc_to_target: !function lmms_eval.tasks.vstat.utils.doc_to_target
process_docs: !function lmms_eval.tasks.vstat.utils.process_docs
process_results: !function utils.process_results_prompt1
metric_list:
  - metric: Numeric_MRA
    aggregation: !function lmms_eval.tasks.vstat.utils.aggregate_mean
    higher_is_better: true
  - metric: MCQ_ACC
    aggregation: !function lmms_eval.tasks.vstat.utils.aggregate_mean
    higher_is_better: true
  - metric: ALL_Score_avg
    aggregation: !function lmms_eval.tasks.vstat.utils.aggregate_mean
    higher_is_better: true
generation_kwargs:
  max_new_tokens: 16384
  temperature: 0
  do_sample: false
lmms_eval_specific_kwargs:
  default:
    pre_prompt: ""
    mcq_post_prompt: ""
    na_post_prompt: ""
metadata:
  version: 0.0
